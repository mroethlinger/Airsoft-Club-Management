name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', tools: composer }
      - run: composer install --no-interaction --no-progress
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: vendor/bin/phpcs

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', wp: '6.4' }
          - { php: '8.4', wp: 'latest' }
    services:
      mysql:
        image: mariadb:10.6
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: wp_test }
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: mysqli, tools: composer }
      - run: sudo apt-get update -q && sudo apt-get install -yq subversion
      - run: composer install --no-interaction --no-progress
      - run: bash bin/ci-install-wp-tests.sh ${{ matrix.wp }}
      - run: vendor/bin/phpunit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci --no-audit --no-fund
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: bash bin/build-zip.sh
      - name: ZIP contains built app and no dev files
        run: |
          L=$(unzip -Z1 build/airsoft-club-management.zip)
          grep -q 'assets/app/manifest.json' <<< "$L"
          ! grep -qE '/(tests|bin|docs|app|vendor|node_modules)/' <<< "$(sed 's#^airsoft-club-management/assets/app/#X/#' <<< "$L")"
      - uses: actions/upload-artifact@v4
        with: { name: plugin-zip, path: build/airsoft-club-management.zip }

  activate:
    # Installs the built ZIP on a fresh WordPress and activates it.
    needs: build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.6
        env: { MARIADB_ROOT_PASSWORD: root, MARIADB_DATABASE: wp }
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/download-artifact@v4
        with: { name: plugin-zip }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: mysqli, tools: wp-cli }
      - name: Fresh WordPress, install and activate plugin
        run: |
          mkdir wp && cd wp
          wp core download --quiet
          wp config create --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --extra-php <<< "define( 'WP_DEBUG', true ); define( 'WP_DEBUG_LOG', true );"
          wp core install --url=http://localhost --title=Test --admin_user=admin --admin_email=admin@example.org --skip-email --admin_password="$(openssl rand -hex 16)"
          wp plugin install ../airsoft-club-management.zip --activate
          wp plugin status airsoft-club-management | grep -q 'Status: Active'
          test "$(wp option get acm_version)" != ""
          if [ -s wp-content/debug.log ]; then cat wp-content/debug.log; exit 1; fi
